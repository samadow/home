  <title>Responsive Grid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #888;
      font-family: sans-serif;
      padding: 20px;

      text-align: center;
      color: #fff;
      font-size: 1.4rem;
      margin-bottom: 16px;
      font-weight: normal;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 6px;
    }

    .item {
      background: #b0b0b0;
      color: #333;
      font-size: 0.75rem;
      padding: 6px 8px;
      min-height: 30px;
      display: flex;

    /* Row 9 */
    .i37 { grid-column: 1; }
    .i39 { grid-column: 2 / 10; }
    .i38 { grid-column: 1; }
